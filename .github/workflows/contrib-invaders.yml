name: Refresh activity profile assets

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate activity-aware profile SVGs
        run: node scripts/generate-contrib-invaders.mjs ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-invaders.svg assets/tuned.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile visuals from GitHub activity"
          git push
