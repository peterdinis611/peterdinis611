<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="About Peter Dinis">
  <defs>
    <pattern id="aboutDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#242424"/>
    </pattern>
    <style>
      <![CDATA[
        .eyebrow {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 11px;
          letter-spacing: 0.28em;
          fill: #4c8bff;
        }
        .name {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 34px;
          font-weight: 700;
          letter-spacing: -0.04em;
          fill: #eeeeee;
        }
        .label {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 10px;
          letter-spacing: 0.2em;
          fill: #888888;
        }
        .value {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 15px;
          fill: #eeeeee;
        }
        .chip {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12px;
          fill: #eeeeee;
        }
        .arrow {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12px;
          fill: #4c8bff;
        }
        .tag {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 13px;
          fill: #888888;
        }
        .badge {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 11px;
          letter-spacing: 0.16em;
          fill: #eeeeee;
        }
        .idnum {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 11px;
          letter-spacing: 0.14em;
          fill: #4c8bff;
        }
        .rise {
          opacity: 0;
          animation: up 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .d1 { animation-delay: 0.04s; }
        .d2 { animation-delay: 0.12s; }
        .d3 { animation-delay: 0.2s; }
        .d4 { animation-delay: 0.28s; }
        .d5 { animation-delay: 0.36s; }
        .pulse {
          animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes up {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.3; }
        }
      ]]>
    </style>
  </defs>

  <rect width="920" height="300" fill="#111111"/>
  <rect width="920" height="300" fill="url(#aboutDots)" opacity="0.7"/>
  <rect x="16" y="16" width="888" height="268" fill="#181818" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="16" y="16" width="4" height="268" fill="#4c8bff"/>

  <!-- left identity -->
  <g class="rise d1">
    <text x="44" y="50" class="eyebrow">DOSSIER</text>
    <text x="140" y="50" class="idnum">ID / 611</text>
    <text x="44" y="100" class="name">peter dinis</text>
    <text x="44" y="128" class="tag">full-stack developer</text>
  </g>

  <g class="rise d2">
    <rect x="44" y="152" width="280" height="48" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
    <text x="60" y="172" class="label">BASE</text>
    <text x="60" y="190" class="value">praha / czechia</text>

    <rect x="44" y="212" width="280" height="48" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
    <text x="60" y="232" class="label">STATUS</text>
    <circle class="pulse" cx="68" cy="248" r="4" fill="#555555"/>
    <text x="82" y="252" class="badge">OFFLINE</text>
  </g>

  <line x1="352" y1="36" x2="352" y2="264" stroke="#2a2a2a" stroke-width="1"/>

  <!-- right details -->
  <g class="rise d2">
    <text x="376" y="50" class="eyebrow">PROFILE</text>
  </g>

  <g class="rise d3">
    <rect x="376" y="68" width="508" height="56" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
    <text x="392" y="90" class="label">ROLE</text>
    <text x="392" y="112" class="value">full-stack / js / ts ecosystem</text>
  </g>

  <g class="rise d4">
    <text x="376" y="152" class="label">CRAFT PIPELINE</text>
    <rect x="376" y="164" width="110" height="34" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
    <text x="392" y="186" class="chip">figma</text>
    <text x="496" y="186" class="arrow">-&gt;</text>
    <rect x="520" y="164" width="110" height="34" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
    <text x="536" y="186" class="chip">next.js</text>
    <text x="640" y="186" class="arrow">-&gt;</text>
    <rect x="664" y="164" width="100" height="34" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
    <text x="680" y="186" class="chip">nestjs</text>
    <text x="774" y="186" class="arrow">-&gt;</text>
    <rect x="798" y="164" width="86" height="34" fill="#111111" stroke="#4c8bff" stroke-width="1"/>
    <text x="810" y="186" class="chip">pg</text>
  </g>

  <g class="rise d5">
    <line x1="376" y1="220" x2="884" y2="220" stroke="#2a2a2a" stroke-width="1"/>
    <text x="376" y="246" class="tag">Builds modern web &amp; mobile experiences end-to-end.</text>
    <text x="376" y="268" class="tag">Clean code. Sharp UI. Ships that hold up.</text>
  </g>
</svg>
