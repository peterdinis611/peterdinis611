<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="Jumping PC">
  <defs>
    <style>
      <![CDATA[
        .label {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 11px;
          letter-spacing: 0.28em;
          fill: #4c8bff;
        }
        .pc {
          transform-origin: 160px 95px;
          animation: jump 0.85s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }
        .shadow {
          transform-origin: 160px 118px;
          animation: squash 0.85s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }
        .screen-glow {
          animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes jump {
          0%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
          18% { transform: translateY(0) scaleY(0.92) scaleX(1.06); }
          40% { transform: translateY(-28px) scaleY(1.05) scaleX(0.96); }
          55% { transform: translateY(-28px) scaleY(1.05) scaleX(0.96); }
          75% { transform: translateY(0) scaleY(0.9) scaleX(1.08); }
          85% { transform: translateY(-4px) scaleY(1.02) scaleX(0.98); }
        }
        @keyframes squash {
          0%, 100% { transform: scaleX(1); opacity: 0.35; }
          18% { transform: scaleX(1.25); opacity: 0.5; }
          40%, 55% { transform: scaleX(0.55); opacity: 0.15; }
          75% { transform: scaleX(1.35); opacity: 0.55; }
          85% { transform: scaleX(0.9); opacity: 0.3; }
        }
        @keyframes blink {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <rect width="320" height="150" fill="#111111"/>

  <!-- floor shadow -->
  <ellipse class="shadow" cx="160" cy="118" rx="36" ry="6" fill="#4c8bff"/>

  <!-- jumping PC -->
  <g class="pc">
    <!-- monitor -->
    <rect x="118" y="38" width="84" height="58" rx="3" fill="#181818" stroke="#4c8bff" stroke-width="2"/>
    <rect class="screen-glow" x="126" y="46" width="68" height="42" fill="#0a1220" stroke="#4c8bff" stroke-width="1"/>
    <!-- screen content lines -->
    <rect x="134" y="54" width="36" height="3" fill="#4c8bff" opacity="0.9"/>
    <rect x="134" y="62" width="48" height="2" fill="#4c8bff" opacity="0.55"/>
    <rect x="134" y="68" width="42" height="2" fill="#4c8bff" opacity="0.4"/>
    <rect x="134" y="74" width="28" height="2" fill="#4c8bff" opacity="0.35"/>
    <!-- stand -->
    <rect x="152" y="96" width="16" height="8" fill="#2a2a2a"/>
    <rect x="140" y="104" width="40" height="6" rx="1" fill="#4c8bff"/>
    <!-- keyboard -->
    <rect x="112" y="112" width="96" height="10" rx="2" fill="#181818" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="120" y="115" width="10" height="3" fill="#4c8bff" opacity="0.5"/>
    <rect x="134" y="115" width="10" height="3" fill="#4c8bff" opacity="0.35"/>
    <rect x="148" y="115" width="10" height="3" fill="#4c8bff" opacity="0.5"/>
    <rect x="162" y="115" width="10" height="3" fill="#4c8bff" opacity="0.35"/>
    <rect x="176" y="115" width="18" height="3" fill="#4c8bff" opacity="0.7"/>
  </g>

  <text x="160" y="142" text-anchor="middle" class="label">BOOTING WORKSTATION</text>
</svg>
