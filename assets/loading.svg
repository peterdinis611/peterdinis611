<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="Warming up">
  <defs>
    <style>
      <![CDATA[
        .label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.28em;fill:#c6ff3d}
        .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.08em;fill:#4c8bff}
        .ball{transform-origin:160px 78px;animation:kick .9s cubic-bezier(.28,.84,.42,1) infinite}
        .shadow{transform-origin:160px 118px;animation:squash .9s cubic-bezier(.28,.84,.42,1) infinite}
        .spin{transform-origin:160px 72px;animation:spin .9s linear infinite}
        @keyframes kick{
          0%,100%{transform:translateY(0) scaleY(1) scaleX(1)}
          18%{transform:translateY(0) scaleY(.9) scaleX(1.08)}
          42%{transform:translateY(-30px) scaleY(1.06) scaleX(.94)}
          58%{transform:translateY(-30px) scaleY(1.06) scaleX(.94)}
          76%{transform:translateY(0) scaleY(.88) scaleX(1.1)}
          88%{transform:translateY(-5px) scaleY(1.02) scaleX(.98)}
        }
        @keyframes squash{
          0%,100%{transform:scaleX(1);opacity:.35}
          18%{transform:scaleX(1.3);opacity:.5}
          42%,58%{transform:scaleX(.5);opacity:.12}
          76%{transform:scaleX(1.4);opacity:.55}
          88%{transform:scaleX(.9);opacity:.3}
        }
        @keyframes spin{to{transform:rotate(360deg)}}
      ]]>
    </style>
  </defs>
  <rect width="320" height="150" fill="#070908"/>
  <ellipse class="shadow" cx="160" cy="118" rx="28" ry="5" fill="#c6ff3d"/>
  <g class="ball">
    <g class="spin">
      <circle cx="160" cy="72" r="18" fill="#f3efe4"/>
      <circle cx="154" cy="66" r="5" fill="#ffffff" opacity="0.75"/>
      <path d="M148,70 Q160,58 172,70 Q166,82 160,90 Q154,82 148,70Z" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
      <path d="M144,76 Q160,72 176,76" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    </g>
  </g>
  <text x="160" y="140" text-anchor="middle" class="label">WARMING UP</text>
  <text x="160" y="18" text-anchor="middle" class="code">// boot stadium</text>
</svg>
