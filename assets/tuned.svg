<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="Currently tuned for">
  <defs>
    <style>
      <![CDATA[
        .title {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12px;
          letter-spacing: 0.2em;
          fill: #4c8bff;
        }
        .num {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12px;
          fill: #4c8bff;
        }
        .line {
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 15px;
          fill: #eeeeee;
        }
        .rise { opacity: 0; animation: up 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .d1 { animation-delay: 0.05s; }
        .d2 { animation-delay: 0.14s; }
        .d3 { animation-delay: 0.23s; }
        .d4 { animation-delay: 0.32s; }
        .d5 { animation-delay: 0.41s; }
        @keyframes up {
          from { opacity: 0; transform: translateX(-10px); }
          to { opacity: 1; transform: translateX(0); }
        }
      ]]>
    </style>
  </defs>

  <rect width="920" height="220" fill="#111111"/>
  <rect x="18" y="18" width="884" height="184" fill="#181818" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="18" y="18" width="5" height="184" fill="#4c8bff"/>

  <text class="rise d1 title" x="48" y="52">CURRENTLY TUNED FOR</text>

  <g class="rise d2">
    <text x="48" y="92" class="num">01</text>
    <rect x="84" y="84" width="14" height="3" fill="#4c8bff"/>
    <text x="110" y="92" class="line">product UIs that feel intentional</text>
  </g>
  <g class="rise d3">
    <text x="48" y="126" class="num">02</text>
    <rect x="84" y="118" width="14" height="3" fill="#4c8bff"/>
    <text x="110" y="126" class="line">APIs that stay boringly reliable</text>
  </g>
  <g class="rise d4">
    <text x="48" y="160" class="num">03</text>
    <rect x="84" y="152" width="14" height="3" fill="#4c8bff"/>
    <text x="110" y="160" class="line">mobile with React Native when needed</text>
  </g>
  <g class="rise d5">
    <text x="48" y="194" class="num">04</text>
    <rect x="84" y="186" width="14" height="3" fill="#4c8bff"/>
    <text x="110" y="194" class="line">collaboration over ceremony</text>
  </g>
</svg>
